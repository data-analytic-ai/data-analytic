# Docker profile configuration
# Used when the application runs INSIDE a Docker container

# ---- Primary DataSource = Spring Batch metadata (PostgreSQL) ----
# FOR DOCKER: Use Docker network hostnames
spring.datasource.url=jdbc:postgresql://metadata-db:5432/data_analytic_batch
spring.datasource.username=postgres
spring.datasource.password=postgres

# ---- Mongo (state store) ----
# FOR DOCKER: Use Docker network hostname
spring.data.mongodb.uri=mongodb://root:password@state-store:27017/dataAnalytic?authSource=admin