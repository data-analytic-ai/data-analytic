# Port
server.port=${SERVER_PORT:8081}

# JWT
jwt.secret=${JWT_SECRET:lElvJSZSPraJvRoivEeMKVThpBupn/1gUaJgNuSgp7c=}

# ---- Primary DataSource = Spring Batch metadata (PostgreSQL) ----
spring.datasource.url=${BRIDGE_METADATA_JDBC_URL:jdbc:postgresql://localhost:5433/data_analytic_batch}
spring.datasource.username=${BRIDGE_METADATA_USERNAME:postgres}
spring.datasource.password=${BRIDGE_METADATA_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Batch schema + do not auto-run jobs
spring.batch.jdbc.initialize-schema=ALWAYS
spring.batch.job.enabled=false
# (Boot will auto-create Batch tables on startup when set to ALWAYS.) :contentReference[oaicite:1]{index=1}

# ---- Mongo (state store) ----
spring.data.mongodb.uri=${BRIDGE_STATE_STORE_URI:mongodb://root:password@localhost:27017/dataAnalytic?authSource=admin}
# Correct key is spring.data.mongodb.uri. :contentReference[oaicite:2]{index=2}

# Optional logging
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.jdbc.datasource=DEBUG
logging.level.org.springframework.boot.autoconfigure.jdbc=DEBUG
logging.level.org.postgresql=DEBUG

# If you are not using Spring Data JDBC repositories
spring.data.jdbc.repositories.enabled=false

# Never run schema.sql/data.sql implicitly
spring.sql.init.mode=never

# --- Actuator configuration ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always